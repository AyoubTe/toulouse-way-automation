<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agenda – Toulouse Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/*__CSS__*/
.hero{background:var(--ink);color:#fff;padding:0 20px 56px;position:relative;overflow:hidden}
.topbar{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{display:inline-flex;background:#fff;border-radius:12px;padding:8px 12px}.logo img{height:36px;display:block}
.lang{display:flex;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.lang a{color:#fff;text-decoration:none;padding:6px 14px;font-weight:700;font-size:14px}.lang a[aria-current=true]{background:#fff;color:var(--ink)}
.hero-in{max-width:960px;margin:0 auto;padding-top:28px}
.hero h1{font-size:clamp(34px,6vw,56px);font-weight:800}
.hero p{font-size:19px;color:#D8E3E4;margin:12px 0 0;max-width:54ch}
.path{position:absolute;inset-inline:0;bottom:6px;width:100%;height:70px;pointer-events:none}
main{max-width:960px;margin:0 auto;padding:28px 16px 56px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.month{font-family:var(--f-display);font-size:24px;font-weight:700;margin:30px 0 12px;text-transform:capitalize}
.month:first-of-type{margin-top:0}
.ev{display:grid;grid-template-columns:88px 1fr auto;gap:20px;align-items:center;background:#fff;border-radius:var(--r-md);padding:18px 20px;margin-bottom:12px;border-inline-start:5px solid transparent}
.ev.focus{border-inline-start-color:var(--orange)}
.day{text-align:center;line-height:1}
.day b{display:block;font-family:var(--f-display);font-weight:800;font-size:42px;color:var(--orange-ink)}
.day span{display:block;font-size:14px;color:var(--muted);margin-top:6px;text-transform:capitalize}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--brique);color:var(--ink)}
.tag.formation{background:#DCEFEC;color:#0B5C52}
.ev h2{font-size:21px;margin:8px 0 4px}
.meta{color:var(--ink-2);font-size:15px}
.desc{color:var(--muted);font-size:15px;margin-top:6px;max-width:60ch}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:150px}
.seats{font-size:14px;color:var(--muted);text-align:end}
.seats strong{color:var(--ink)}
.meter{width:130px;height:6px;border-radius:3px;background:var(--mist);overflow:hidden}.meter i{display:block;height:100%;background:var(--orange);border-radius:3px}
.full{color:var(--err);font-weight:700}
.empty{background:#fff;border-radius:var(--r-md);padding:40px 24px;text-align:center;color:var(--muted)}
@media (max-width:700px){.ev{grid-template-columns:64px 1fr}.side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;min-width:0}.side .seats{text-align:start}.day b{font-size:34px}}
dialog{border:0;border-radius:var(--r-lg);padding:0;width:min(560px,calc(100vw - 24px));box-shadow:var(--shadow);color:var(--ink)}
dialog::backdrop{background:rgba(18,52,59,.55)}
.dlg-head{padding:22px 26px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.dlg-head h2{font-size:22px}.dlg-head p{margin:6px 0 0;color:var(--muted);font-size:15px}
.x{border:0;background:var(--mist);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:20px;flex:none}
.dlg-body{padding:20px 26px 24px}
.done{text-align:center;padding:12px 0}
.done .mark{width:58px;height:58px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
.done h3{font-family:var(--f-display);font-size:24px;margin:0 0 8px}
.alert{background:var(--err-soft);color:var(--err);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:16px;display:none}
footer{text-align:center;color:var(--muted);font-size:14px;padding:0 16px 32px}
</style>
</head>
<body>
<header class="hero">
  <div class="topbar">
    <a class="logo" id="logo-link"><img id="logo" alt=""></a>
    <nav class="lang" aria-label="Langue / Language"><a href="?lang=fr" data-l="fr">FR</a><a href="?lang=en" data-l="en">EN</a></nav>
  </div>
  <div class="hero-in"><h1 data-t="title"></h1><p data-t="intro"></p></div>
  <svg class="path" viewBox="0 0 1200 70" preserveAspectRatio="none" aria-hidden="true"><path d="M-10 52 C 200 10, 340 66, 560 36 S 900 4, 1060 34 S 1180 56, 1215 30" fill="none" stroke="var(--orange)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/></svg>
</header>
<main>
  <div class="filters" role="group" id="filters"></div>
  <div id="list"></div>
</main>
<footer id="foot"></footer>
<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-head"><div><h2 id="dlg-title"></h2><p id="dlg-meta"></p></div><button class="x" type="button" id="dlg-x">×</button></div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>
<script>
const D = /*__DATA__*/null;
const I18N = {
  fr: { title: 'Formations et événements', intro: 'Ateliers pour réussir votre installation professionnelle et rencontres pour agrandir votre réseau. Gratuit, sur inscription.',
    all: 'Tout', formations: 'Formations', events: 'Événements', Formation: 'Formation', 'Événement': 'Événement', register: "S'inscrire", left: n => `<strong>${n}</strong> place${n > 1 ? 's' : ''} restante${n > 1 ? 's' : ''}`, full: 'Complet',
    online: 'En ligne', empty: 'Aucune date programmée pour le moment. Revenez bientôt !', emptyF: 'Aucune date dans cette catégorie pour le moment.',
    prenom: 'Prénom', nom: 'Nom', email: 'Email', tel: 'Téléphone (facultatif)', rgpd: "J'accepte que Toulouse Way utilise ces informations pour gérer mon inscription et m'envoyer les rappels.",
    send: 'Confirmer mon inscription', sending: 'Inscription…', required: 'Ce champ est obligatoire.', emailErr: 'Indiquez une adresse email valide.', rgpdErr: 'Cochez cette case pour vous inscrire.', close: 'Fermer',
    doneT: 'Vous êtes inscrit·e !', doneP: 'Un email de confirmation vient de partir. Vous recevrez un rappel 3 jours avant, puis la veille.',
    errors: { complet: 'Cette session est complète.', deja_inscrit: 'Vous êtes déjà inscrit·e à cette session avec cet email.', introuvable: "Cette session n'est plus disponible.", invalide: 'Vérifiez les champs du formulaire.' },
    fail: "L'inscription n'a pas abouti. Vérifiez votre connexion puis réessayez." },
  en: { title: 'Trainings and events', intro: 'Workshops to help you settle in professionally and meet-ups to grow your network. Free, registration required.',
    all: 'All', formations: 'Trainings', events: 'Events', Formation: 'Training', 'Événement': 'Event', register: 'Register', left: n => `<strong>${n}</strong> seat${n > 1 ? 's' : ''} left`, full: 'Full',
    online: 'Online', empty: 'Nothing scheduled yet. Check back soon!', emptyF: 'Nothing in this category yet.',
    prenom: 'First name', nom: 'Last name', email: 'Email', tel: 'Phone (optional)', rgpd: 'I agree that Toulouse Way may use this information to manage my registration and send me reminders.',
    send: 'Confirm my registration', sending: 'Registering…', required: 'This field is required.', emailErr: 'Enter a valid email address.', rgpdErr: 'Tick this box to register.', close: 'Close',
    doneT: "You're registered!", doneP: 'A confirmation email is on its way. We will send you a reminder 3 days before, then the day before.',
    errors: { complet: 'This session is full.', deja_inscrit: 'You are already registered for this session with this email.', introuvable: 'This session is no longer available.', invalide: 'Please check the form fields.' },
    fail: 'Registration failed. Check your connection and try again.' }
};
const lang = D.lang === 'en' ? 'en' : 'fr', t = I18N[lang], loc = lang === 'en' ? 'en-GB' : 'fr-FR';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.documentElement.lang = lang; document.title = t.title + ' – ' + D.P.nom_asso;
document.documentElement.style.setProperty('--orange', D.P.couleur_principale);
document.documentElement.style.setProperty('--ink', D.P.couleur_encre);
document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
document.querySelectorAll('.lang a').forEach(a => { a.setAttribute('aria-current', a.dataset.l === lang); if (D.focus) a.href += '&session=' + encodeURIComponent(D.focus); });
logo.src = D.P.logo_url; logo.alt = D.P.nom_asso; document.getElementById('logo-link').href = D.P.site_url;
foot.textContent = D.P.slogan + ' · ' + D.P.nom_asso;
document.getElementById('dlg-x').setAttribute('aria-label', t.close);

let filter = 'all';
const sessions = D.sessions.slice().sort((a, b) => (a.date + a.heure_debut).localeCompare(b.date + b.heure_debut));
const title = s => lang === 'en' && s.titre_en ? s.titre_en : s.titre;
const desc = s => lang === 'en' && s.description_en ? s.description_en : s.description;
const dt = iso => new Date(iso + 'T12:00:00Z');
const fmt = (iso, o) => new Intl.DateTimeFormat(loc, Object.assign({ timeZone: 'UTC' }, o)).format(dt(iso));
const hours = s => s.heure_debut ? (s.heure_fin ? `${s.heure_debut} – ${s.heure_fin}` : s.heure_debut) : '';
const where = s => s.lien_visio && (!s.lieu || /ligne|online/i.test(s.lieu)) ? t.online : s.lieu;

function renderFilters() {
  const has = k => sessions.some(s => s.type === k);
  const opts = [['all', t.all], ...(has('Formation') ? [['Formation', t.formations]] : []), ...(has('Événement') ? [['Événement', t.events]] : [])];
  filters.innerHTML = opts.length > 2 ? opts.map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${filter === k}">${l}</button>`).join('') : '';
}
filters.addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; renderFilters(); render(); } });
function render() {
  const items = sessions.filter(s => filter === 'all' || s.type === filter);
  if (!items.length) { list.innerHTML = `<div class="empty">${sessions.length ? t.emptyF : t.empty}</div>`; return; }
  let html = '', m = '';
  for (const s of items) {
    const mm = fmt(s.date, { month: 'long', year: 'numeric' });
    if (mm !== m) { m = mm; html += `<h2 class="month">${esc(mm)}</h2>`; }
    const full = s.places > 0 && s.restantes <= 0;
    html += `<article class="ev${D.focus === s.id ? ' focus' : ''}" id="s-${esc(s.id)}">
      <div class="day" aria-hidden="true"><b>${fmt(s.date, { day: 'numeric' })}</b><span>${esc(fmt(s.date, { weekday: 'short' }))}</span></div>
      <div><span class="tag ${s.type === 'Formation' ? 'formation' : ''}">${esc(t[s.type] || s.type)}</span>
        <h2>${esc(title(s))}</h2>
        <div class="meta"><span class="sr-only">${esc(fmt(s.date, { weekday: 'long', day: 'numeric', month: 'long' }))}, </span>${esc([hours(s), where(s)].filter(Boolean).join(' · '))}</div>
        ${desc(s) ? `<p class="desc">${esc(desc(s))}</p>` : ''}</div>
      <div class="side">${s.places > 0 ? (full ? `<span class="full">${t.full}</span>` : `<div class="seats">${t.left(s.restantes)}<div class="meter" aria-hidden="true"><i style="width:${Math.min(100, Math.round(100 * (s.places - s.restantes) / s.places))}%"></i></div></div>`) : '<span></span>'}
        <button class="btn btn-primary" type="button" data-reg="${esc(s.id)}" ${full ? 'disabled' : ''}>${t.register}</button></div></article>`;
  }
  list.innerHTML = html;
}
list.addEventListener('click', e => { const b = e.target.closest('[data-reg]'); if (b) openForm(sessions.find(s => s.id === b.dataset.reg)); });

const dlg = document.getElementById('dlg');
document.getElementById('dlg-x').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openForm(s) {
  document.getElementById('dlg-title').textContent = title(s);
  document.getElementById('dlg-meta').textContent = [fmt(s.date, { weekday: 'long', day: 'numeric', month: 'long' }), hours(s), where(s)].filter(Boolean).join(' · ');
  document.getElementById('dlg-body').innerHTML = `<form id="rf" novalidate><div class="alert" id="ralert" role="alert"></div>
    <div class="grid-2"><div class="field"><label for="r-prenom">${t.prenom} <span class="req">*</span></label><input class="input" id="r-prenom" name="prenom" autocomplete="given-name" maxlength="80"><span class="err-msg">${t.required}</span></div>
    <div class="field"><label for="r-nom">${t.nom} <span class="req">*</span></label><input class="input" id="r-nom" name="nom" autocomplete="family-name" maxlength="80"><span class="err-msg">${t.required}</span></div></div>
    <div class="field"><label for="r-email">${t.email} <span class="req">*</span></label><input class="input" id="r-email" name="email" type="email" autocomplete="email" maxlength="120"><span class="err-msg">${t.emailErr}</span></div>
    <div class="field"><label for="r-tel">${t.tel}</label><input class="input" id="r-tel" name="telephone" type="tel" autocomplete="tel" maxlength="30"></div>
    <div class="field"><label class="check"><input type="checkbox" name="rgpd"><span>${t.rgpd}</span></label><span class="err-msg">${t.rgpdErr}</span></div>
    <button class="btn btn-primary" type="submit" id="rsend">${t.send}</button></form>`;
  const rf = document.getElementById('rf');
  rf.addEventListener('submit', e => submit(e, s, rf));
  dlg.showModal(); setTimeout(() => rf.prenom.focus(), 30);
}
async function submit(e, s, rf) {
  e.preventDefault();
  const v = n => rf[n].value.trim(), bad = [];
  const mark = (el, isBad) => { el.closest('.field').classList.toggle('invalid', isBad); if (isBad) bad.push(el); };
  mark(rf.prenom, !v('prenom')); mark(rf.nom, !v('nom')); mark(rf.email, !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v('email'))); mark(rf.rgpd, !rf.rgpd.checked);
  if (bad.length) { bad[0].focus(); return; }
  const btn = document.getElementById('rsend'), al = document.getElementById('ralert');
  btn.disabled = true; btn.textContent = t.sending; al.style.display = 'none';
  try {
    const r = await fetch(D.submit, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: s.id, prenom: v('prenom'), nom: v('nom'), email: v('email'), telephone: v('telephone'), langue: lang, consentement: true }) });
    const res = await r.json().catch(() => ({}));
    if (!res.ok) { al.textContent = t.errors[res.code] || t.fail; al.style.display = 'block'; btn.disabled = false; btn.textContent = t.send; if (res.code === 'complet') { s.restantes = 0; render(); } return; }
    s.restantes = Math.max(0, (s.restantes || 0) - 1); render();
    document.getElementById('dlg-body').innerHTML = `<div class="done" role="status"><div class="mark" aria-hidden="true">✓</div><h3>${t.doneT}</h3><p>${t.doneP}</p><button class="btn btn-ghost" type="button" onclick="dlg.close()">${t.close}</button></div>`;
  } catch (err) { al.textContent = t.fail; al.style.display = 'block'; btn.disabled = false; btn.textContent = t.send; }
}
renderFilters(); render();
if (D.focus) { const el = document.getElementById('s-' + D.focus); if (el) { el.scrollIntoView({ block: 'center' }); const s = sessions.find(x => x.id === D.focus); if (s && !(s.places > 0 && s.restantes <= 0)) openForm(s); } }
</script>
</body>
</html>
